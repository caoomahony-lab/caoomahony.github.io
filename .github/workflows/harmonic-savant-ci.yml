name: Harmonic Savant CI

on:
  push:
    branches:
      - harmonic-savant-v0.2-core
    paths:
      - 'holographic-harmony/**'
      - '.github/workflows/harmonic-savant-ci.yml'
  pull_request:
    paths:
      - 'holographic-harmony/**'
      - '.github/workflows/harmonic-savant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holographic-harmony
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: holographic-harmony/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
